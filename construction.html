<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Le site Izilynk est actuellement en construction."
    >
    <title>Izilynk | Site en construction</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    >
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page-shell min-vh-100 d-flex flex-column">
      <section class="container construction-container flex-grow-1 py-4 py-sm-5">
        <div class="construction-content mx-auto text-center">
          <img
            class="brand-logo img-fluid"
            src="pictures/logo_color.svg"
            alt="Logo Izilynk"
            width="270"
            height="154"
          >

          <p class="construction-kicker mt-4 mb-2">Izilynk</p>
          <h1 class="construction-title mb-3">Site en construction</h1>
          <p class="construction-text mx-auto mb-4">
            Notre site arrive bientôt. En attendant, retrouvez toutes les
            informations utiles depuis notre page principale.
          </p>

          <a class="btn link-button link-button-accent construction-back-link" href="index.html" aria-label="Retourner à la page principale Izilynk">
            <i class="bi bi-arrow-left" aria-hidden="true"></i>
            <span>Retour</span>
          </a>
        </div>
      </section>

      <section class="baseline-section" aria-label="Baseline Izilynk">
        <img
          class="baseline-image img-fluid w-100"
          src="pictures/baseline_fond_vert.png"
          alt="Play - Connect - Enjoy"
          width="2917"
          height="1667"
        >
      </section>

      <footer class="site-footer py-3 text-center">
        <div class="container">
          <small>&copy; 2026 Izilynk. Tous droits réservés.</small>
        </div>
      </footer>
    </main>
  </body>
</html>
